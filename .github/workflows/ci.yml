# Checks every push and pull request; a push to main that passes them is deployed.
#
# Deploying needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token for the account the Workers run in: the "Edit Cloudflare Workers"
#                          template plus Account > D1 > Edit, with the anminas.com zone included
#   CLOUDFLARE_ACCOUNT_ID  that account's id
# Without them the checks still run and the deploy is skipped with a warning.
#
# The website (apps/site) is deployed on every push, the game server (apps/server) only when the push changed it:
# deploying the server restarts every room, which ends the matches being played. Run the workflow by hand
# (Actions > CI > Run workflow) to deploy everything, e.g. after a deploy failed or a run was cancelled.
#
# The web game (rimfire.pages.dev) is built by Cloudflare Pages from main, unchecked. To deploy it from here instead,
# turn off automatic production deployments in the Pages project (Settings > Builds > Branch control) and set the
# repository variable PAGES_FROM_CI to true.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; on main, runs finish in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version in package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @rimfire/client typecheck
      - run: pnpm test
      - name: Bundle the game server
        run: pnpm --filter @rimfire/server check
      - run: pnpm build
      - run: pnpm build:site

  plan:
    name: What to deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$HAS_SECRETS" != true ]; then
            echo "::warning::Not deployed: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't set (see ci.yml)."
            exit 0
          fi
          echo ready=true >> "$GITHUB_OUTPUT"
          # The server unless this push left it alone. Run by hand, or with the previous commit gone (a force push),
          # it goes too.
          server=true
          if [ "$GITHUB_EVENT_NAME" = push ] && git fetch -q --depth=1 origin "$BEFORE" &&
            git diff --quiet "$BEFORE" HEAD -- apps/server packages pnpm-lock.yaml; then
            server=false
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "Game server: $server"

  deploy:
    name: Deploy
    needs: [check, plan]
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site first: the server links to its pages.
      - name: Deploy the website
        run: pnpm deploy:site
      - name: Deploy the game server
        if: needs.plan.outputs.server == 'true'
        run: pnpm deploy:server
      - name: Deploy the web game
        if: vars.PAGES_FROM_CI == 'true'
        run: |
          pnpm build
          pnpm --filter @rimfire/server exec wrangler pages deploy ../client/dist --project-name rimfire \
            --branch main --commit-hash "$GITHUB_SHA"
